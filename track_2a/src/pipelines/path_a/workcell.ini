# The workcell Path A is set up for: the camera, the table, the trays and
# the objects of the Hack Apertus 2026 challenge, and the models it uses.
# The code holds the logic; this file holds every value particular to this
# setup. For another workcell, copy this file and re-measure the values
# (see each comment).

[apertus]
# The server and model; --base-url and --model override them for one run.
model = apertus-v1.5-70b
base_url = https://hackapertus.livemap.sh/v1
# The single-call planner's rules (a file in prompts/). planner_v2 scored
# 58.9 against 58.9-60.5 for v1.
single_call_prompt = planner_v1
# Corrections the single-call planner may ask for after a broken answer.
single_call_retries = 2
# Its reply limit, in tokens.
single_call_max_tokens = 700
# The three agents' rules (files in prompts/). The v3 safety prompt gave
# 62.5 (3 runs) and the v3 reference prompt 59.6 (2 runs), against 64.1.
safety_prompt = agent_safety_v2
reference_prompt = agent_reference_v2
constraint_prompt = agent_constraint_v4
# Corrections each agent may be asked for after an invalid reply.
agent_retries = 2
# The reference agent thinks step by step: in a scene with ten objects,
# 700 cut its reply short.
agent_max_tokens = 2000
# How many instructions are sent to Apertus at the same time. The
# instructions are independent, so this changes only the run time; the
# next photo's perception also runs while Apertus answers. 1 answers them
# one after another.
parallel_requests = 4

[sam3]
# Meta's SAM 3 (SAM License) from an ungated copy: model.safetensors has the
# same SHA-256 as facebook/sam3 (6d06f0a5f84e...). Pinned to a commit, so a
# later change to that repository cannot change our results. SAM3_MODEL in
# the environment overrides the model (facebook/sam3 needs HF_TOKEN).
model = jetjodh/sam3
revision = 1aa50ce07302cb375f85d8084b68a0fb378b8d85
# The minimum detection score, and the mask probability cut.
threshold = 0.5
mask_threshold = 0.5
# One prompt per kind of object, in this order: the objects named in
# dataset/README.md, plus a hand for the unsafe cases. "metal bracket" is
# the grey metal parts: "grey metal part" also returned the grey tray and
# the rails. "orange fruit" and "small yellow gear" repeat "mandarin" and
# "yellow gear", which each missed in some scenes. "object" is a catch-all:
# it finds the small white part whole, and anything not named here. "grey
# tray" and "black mat" are the table's two surfaces: their outlines have
# holes where objects lie.
prompts =
    red gear
    yellow gear
    small yellow gear
    red cube
    mug
    mandarin
    orange fruit
    banana
    plate
    saucer
    metal bracket
    white part
    grey tray
    black mat
    hand
    object

[depth]
# Monocular depth, used only to compare neighbours (maybe_on).
model = depth-anything/Depth-Anything-V2-Small-hf
# How far around a contact to compare heights, in pixels.
window_px = 30

[labels]
# Prompts that name the same kind as another prompt: prompt = label.
orange fruit = mandarin
small yellow gear = yellow gear
saucer = plate

[ids]
# Labels whose id is not simply the label: label = id.
metal bracket = grey_part
object = unknown_object

[label tiers]
# Which label wins when two prompts find the same thing: a named object
# (1, the default) beats a vague prompt (2) beats "object" (3).
white part = 2
object = 3

[kinds]
# Things lie in or on these; they are never fragments of them.
containers =
    grey tray
    plate
    saucer
# A circle recovers their outline when part is hidden.
round =
    red gear
    yellow gear

[not pickable]
# What cannot be picked, and why: label = reason. The organisers confirmed
# that this is a property of the object, not a size rule: the gripper
# closes on one narrow part (a gear's hub, a mug's rim, a part's edge), and
# only the plate and the saucer have none. Every other object can be
# picked, including ones nobody named.
plate = it lies flat and has no narrow part for the gripper to close on; things can still be put on it
saucer = it lies flat and has no narrow part for the gripper to close on; things can still be put on it
grey tray = a tray is never picked up; things are put in it
black tray = a tray is never picked up; things are put in it
hand = it is a person's hand

[table]
# Share of a mask that must lie on the tray or the mat to count.
min_on_table = 0.5
# A "black mat" from SAM 3 that overlaps the tray by this share is the
# tray's side, not the mat.
mat_max_tray_overlap = 0.2
# Finding the mat without SAM 3: darker than this (OpenCV 0-255), cleaned
# with an opening of this size, and covering at least this share of the
# photo.
mat_max_brightness = 80
mat_open_px = 25
mat_min_share = 0.05
# The aluminium rails around the table are brighter than this.
rail_min_grey = 170

[objects]
# Smaller masks are specks.
min_area_px = 2000
# Two masks overlapping this much (intersection over union) are the same
# object.
same_iou = 0.7
# Share of a mask inside another for it to be part of the other.
inside = 0.6
# A plate narrower than this is the saucer, in mm.
saucer_max_mm = 155
# A vague detection this close to a plate's centre, as a share of the
# plate's width, is the plate's white middle.
plate_middle_share = 0.1

[leftovers]
# A hole in the tray's or the mat's outline is an object nobody named when
# it is this far from any known object, this wide and this large (px).
margin_px = 12
open_px = 25
min_area_px = 4000

[stacking]
# Share of the lower object's footprint the upper one must cover.
on_min_cover = 0.12
# Masks closer than twice this are touching (px).
touch_px = 10
# For maybe_on: at least this much contact (px) and this much higher, in
# the depth model's relative units.
maybe_min_contact_px = 100
maybe_min_higher = 0.3

[hands]
# How far a hand reaches (px), and how much of an object must lie within
# reach for the hand to be touching it (px).
reach_px = 25
min_overlap_px = 200

[colours]
# Below this saturation (OpenCV 0-255) a colour is white, grey or black:
# white above white_min_value, black below black_max_value.
pale_max_saturation = 60
white_min_value = 170
black_max_value = 70

[colour hues]
# Each colour name with the upper edge of its hue range (OpenCV 0-180), in
# order; a hue above the last is red.
red = 8
orange = 20
yellow = 34
green = 85
blue = 130
purple = 160

[planning]
# What to do when an object only MAY be resting on the one that has to
# move (maybe_on): "lift" it off first, as if it were resting there (the
# public answers expect a plan in these cases), or "ask" the person (more
# cautious; on the public scenes it turned two valid plans into
# questions).
uncertain_support = lift

[apertus vision experiment]
# --with-list in apertus_list.py: the names the detector already knows. It
# made the lists worse: on the ten public scenes Apertus listed about 18
# known objects that were not in the photo (1 without the list).
known =
    red gear
    yellow gear
    red cube
    mug
    mandarin
    banana
    plate
    saucer
    grey metal part
    white part
    hand
