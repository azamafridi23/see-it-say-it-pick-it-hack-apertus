# The workcell this pipeline is set up for: the camera, the table, the trays
# and the objects of the Hack Apertus 2026 challenge. The code holds the
# logic; this file holds what is particular to this setup. For another
# workcell, copy this file and re-measure the values (see each comment).

[detection]
# The kinds of object Apertus is asked to box, one per line. On the dev
# scenes this list found 50 of 52 objects.
kinds =
    red cube
    red gear
    yellow gear
    mug
    mandarin
    banana
    plate
    saucer
    grey part
    white part
    small white part
    hand
# A box over this share of the photo is a tray, not an object. The plate,
# the largest object, covers about 12%.
max_box_area = 0.25
# A box this close to the photo's edge (0-1000 units) is a tray rim or a
# rail; only a hand reaches in from outside.
edge_margin = 2
# Apertus's boxes sit too high. Fitted on the 32 ground-truth masks of the
# dev scenes: true y = y_scale * y + y_shift_px, which cuts the median edge
# error from 103 to 18 px. x is right as given (17 px).
y_scale = 1.065
y_shift_px = 40

[colours]
# Below this saturation (OpenCV 0-255) a colour is white or grey.
pale_max_saturation = 50

[colour hues]
# Each colour name with the upper edge of its hue range (OpenCV 0-180), in
# order. The yellow/green edge sits between the yellow gears (23-29) and
# the lime inside of the mug (37).
red = 6
orange = 15
yellow = 33
green = 85
blue = 130
purple = 170

[stacking]
# Two boxes that overlap by this share of the smaller one may be a stack.
# On the dev scenes, stacks overlap by 0.46-0.91 and neighbours side by
# side by at most 0.33.
min_overlap = 0.4
# How much nearer, in Lab units, the overlap's colour must be to one
# object's colour than to the other's; a red cube on red gears stays only
# touching.
colour_margin = 15

[trays]
# Below this brightness (OpenCV 0-255) a pixel belongs to the black mat. Its
# left edge splits the two trays: x 1243-1275 px on all dev scenes.
mat_max_brightness = 75

[parts]
# The part kinds look alike under this light (grey metal reads almost
# white), but their sizes differ. Measured on the ground-truth masks: grey
# parts 13 x 5 cm, the white part 14 x 10 cm, the small white part 8 x 6 cm.
kinds =
    grey part
    white part
    small white part
# A part shorter than this is the small white part.
small_max_mm = 100
# A part at least this many times longer than wide is a grey part; any
# other part is the white part.
grey_min_aspect = 1.7

[planner]
# Kinds that are never picked up: the plate and the saucer are the only
# objects too wide for the gripper (organisers' answer), and a hand is a
# person.
unpickable =
    plate
    saucer
    hand
# An object at most this many centimetres from a hand is touching it.
hand_gap_cm = 0.3
